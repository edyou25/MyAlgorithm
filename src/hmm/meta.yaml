title: HMM Unsupervised Classification
slug: hmm
summary: Hidden Markov model that learns latent state classes from unlabeled sequences with Baum-Welch EM.
category: Machine Learning
tags:
  - hmm
  - unsupervised learning
  - sequence classification
preferred_renderer: mermaid
formulas:
  - label: Joint sequence likelihood
    latex: p(x_{1:T}, z_{1:T}) = p(z_1)\prod_{t=2}^{T}p(z_t \mid z_{t-1})\prod_{t=1}^{T}p(x_t \mid z_t)
  - label: EM objective
    latex: \theta^{*} = \arg\max_{\theta}\sum_n \log p_{\theta}(x^{(n)}_{1:T_n})
notes:
  - Baum-Welch estimates transition and emission parameters without labeled states.
  - Viterbi decoding converts the learned latent states into a discrete class sequence.
