title: ACT
slug: act
summary: Imitation learning policy that predicts action chunks with a transformer and executes them over short horizons.
category: Learning
tags:
  - imitation learning
  - transformers
  - action chunking
preferred_renderer: mermaid
formulas:
  - label: Behavior cloning objective
    latex: \mathcal{L}_{\text{BC}} = \mathbb{E}_{(o_t, a_{t:t+K-1})}\!\left[\left\lVert \hat{a}_{t:t+K-1} - a_{t:t+K-1}\right\rVert_1\right]
  - label: Chunked policy
    latex: \hat{a}_{t:t+K-1} = \pi_\theta(o_t, z)
notes:
  - ACT stands for Action Chunking with Transformers.
  - Predicting several future actions at once reduces compounding error and allows smoother closed-loop execution.
  - A latent variable or encoder can model demonstration variability when multiple valid action chunks exist.
